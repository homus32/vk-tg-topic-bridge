[project]
name = "vk-topic-bridge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.23,<4",
    "vkbottle>=4.11,<5",
    "telethon>=1.42,<2",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "aiosqlite>=0.22.1,<1",
    "alembic>=1.18.3,<2",
    "pydantic-settings>=2.15,<3",
    "loguru>=0.7.3,<1",
    "aiohttp>=3.14.3,<4",
    "aiohttp-socks>=0.11,<1",
    "python-socks[asyncio]>=2.8.1,<3",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.13,<1",
    "basedpyright>=1.40,<2",
    "pytest>=8.4.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = [".venv", ".omo", "migrations"]
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -m 'not e2e' --cov"
markers = ["e2e: tests requiring real credentials and explicit invocation"]

[tool.coverage.run]
source = ["vk_topic_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
